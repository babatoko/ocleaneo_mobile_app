name: CI

# CI frontend uniquement : lint, typecheck, tests, build (web + provider mock
# — la garantie que le contrat DataProvider n'est pas contourné).
#
# Le job `odoo` (installation des modules + tests sur une vraie instance
# Odoo 14 + Postgres) a été retiré le 13/09/2026 : règle de répartition des
# repos — les modules Odoo vivent dans majavi-software/ocleaneo, et leurs
# tests sont joués par la CI de CE repo (`.github/workflows/ci.yml` là-bas,
# périmètre incluant les 7 modules mobiles + le factor). Ce repo ne versionne
# plus aucun module Odoo ; garder un job qui testait une copie locale des
# modules était une source de divergence (l'embarqué avait dérivé de 11
# versions + 2 modules entiers avant la purge du 13/09).
#
# `push` sur TOUTES les branches, et pas seulement main : une branche poussée
# sans PR déclenche quand même la CI — le retour arrive au push, sans attendre
# qu'une PR existe. `pull_request` teste en plus le résultat de la FUSION avec
# la base (« ma branche passe, mais elle casse une fois fusionnée »).
# Restreint à l'ouverture pour ne pas doubler les runs à chaque push
# (l'option « Require branches to be up to date » de la protection de branche
# couvre le cas où main bouge).
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened]

# Sans ceci, chaque correction poussée coup sur coup laisserait tourner les
# runs précédents jusqu'au bout — le job odoo dure ~5 min (clonage d'Odoo 14
# et de quatre dépôts OCA, installation Python, puis les tests). On annule
# donc les runs rendus caducs par un push plus récent sur la même référence.
# Sauf sur main : son historique de CI est la trace de ce qui a été validé,
# et un run annulé n'en est pas une.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires
        run: npm run test

      - name: Build web/PWA
        run: npm run build

      - name: Build avec le provider mock (aucun backend requis)
        # Vérifie que l'application reste fonctionnelle sans backend : c'est la
        # garantie que le contrat DataProvider n'a pas été contourné.
        run: VITE_DATA_PROVIDER=mock npm run build
