[options]
admin_passwd = admin
db_host = odoo-14-db-dev
db_port = 5432
db_user = odoo
db_password = odoo
http_port = 8069
longpolling_port = 8072
logfile = /var/log/odoo/odoo.log
log_level = info
# Un chemin par dépôt OCA : addons_path attend des répertoires dont les
# ENFANTS sont des modules, or chaque dépôt cloné EST ce répertoire. Un
# unique /opt/oca_addons_v14 pointant sur le parent des quatre clones ne
# ferait donc trouver aucun module. Voir odoo/README.md § Dépendances OCA.
addons_path = /opt/oca_addons_v14/field-service,/opt/oca_addons_v14/project,/opt/oca_addons_v14/timesheet,/opt/oca_addons_v14/web,/opt/custom_addons_v14
limit_time_cpu = 600
limit_time_real = 1200
workers = 0
max_cron_threads = 1
list_db = False
dbfilter = ^odoo14_dev$
