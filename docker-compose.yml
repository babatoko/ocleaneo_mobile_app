services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ocleaneo_db:/app/data
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - DB_PATH=/app/data/ocleaneo.db
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ocleaneo_db:
