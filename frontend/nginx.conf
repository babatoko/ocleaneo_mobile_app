server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # style-src a besoin de 'unsafe-inline' : Ionic (Stencil) injecte ses
    # styles de composants comme des <style> inline dans chaque shadow root,
    # pas via des feuilles externes — sans ça, le rendu de tous les
    # composants ion-* casse (vérifié : violations CSP sur ion-input/
    # ion-button sans ce mot-clé). script-src reste strict à 'self' — aucun
    # script inline ni eval n'est nécessaire (vérifié sur le build de prod).
    # connect-src autorise tout HTTPS : l'URL de l'API Odoo est configurable
    # à l'exécution depuis le profil (voir stores/auth.ts, providers/
    # restClient.ts), donc pas un host fixe connu à la construction — même
    # raison pour OSRM et les tuiles OpenStreetMap (voir README § Serveur OSRM).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;

    # index.html doit être revérifié à chaque visite (c'est lui qui référence
    # les chunks hashés du jour) ; les assets hashés, eux, ne changent jamais
    # une fois publiés — cache long avec immutable.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
